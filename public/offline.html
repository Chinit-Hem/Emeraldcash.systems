<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10b981" />
    <title>Offline | Emerald Cash Systems</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(1.25rem, env(safe-area-inset-top)) 1.25rem max(1.25rem, env(safe-area-inset-bottom));
      }

      main {
        width: min(100%, 28rem);
        border: 1px solid #dbe4ee;
        border-radius: 1.5rem;
        background: #ffffff;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
        padding: 2rem;
      }

      .logo {
        display: block;
        width: min(100%, 11rem);
        height: auto;
        object-fit: contain;
      }

      h1 {
        margin: 1.25rem 0 0.5rem;
        font-size: 1.5rem;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: #475569;
        line-height: 1.6;
      }

      button {
        width: 100%;
        margin-top: 1.5rem;
        border: 0;
        border-radius: 1rem;
        background: #10b981;
        color: #ffffff;
        padding: 0.875rem 1rem;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="/logo-horizontal.png" alt="Emerald Cash" />
      <h1>You are offline</h1>
      <p>Emerald Cash Systems needs a network connection for live vehicle, learning, and asset data. Reconnect, then try again.</p>
      <button type="button" onclick="window.location.reload()">Retry</button>
    </main>
  </body>
</html>
