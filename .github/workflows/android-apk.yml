name: Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - run: npm ci

      - name: Build web app
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          NEXT_PUBLIC_API_URL: https://dummy.example.com
          NEXT_PUBLIC_APP_URL: https://emeraldcash-systems.vercel.app
          SESSION_SECRET: dummy-session-secret-for-ci-build-only-not-real
          CLOUDINARY_CLOUD_NAME: dummy-cloud
          CLOUDINARY_API_KEY: dummy-key
          CLOUDINARY_API_SECRET: dummy-secret
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: dummy-cloud
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: dummy-preset
          CRON_SECRET: dummy-cron-secret
          CAPACITOR_SERVER_URL: https://emeraldcash-systems.vercel.app/login
        run: npm run build

      - name: Sync Capacitor Android
        env:
          CAPACITOR_SERVER_URL: https://emeraldcash-systems.vercel.app/login
        run: npx cap sync android

      - name: Build APKs
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emeraldcash-android-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
