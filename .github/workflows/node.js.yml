name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
      NEXT_PUBLIC_API_URL: https://dummy.example.com
      SESSION_SECRET: dummy-session-secret-for-ci-build-only-not-real
      CLOUDINARY_CLOUD_NAME: dummy-cloud
      CLOUDINARY_API_KEY: dummy-key
      CLOUDINARY_API_SECRET: dummy-secret
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: dummy-cloud
      NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: dummy-preset
      CRON_SECRET: dummy-cron-secret

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run verify:ci
